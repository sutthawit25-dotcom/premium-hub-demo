<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flixie House</title>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     Design plan
     Color: near-black/off-white neutrals + one red brand accent
            (--bg,--surface,--border,--ink,--muted,--accent,--good,--info,--bad)
     Type:  Noto Sans Thai for all Thai copy + Inter for latin/numerals,
            one scale (12/13/14/16/20/26px), tabular numerals on dates/money
     Layout: fixed left rail + topbar on desktop, slide-over drawer + topbar
             on phone; content is cards in a 12px-gap grid that collapses
             tables to stacked cards under 760px
     ============================================================ */
  :root{
    --bg:#f6f6f7; --bg-subtle:#eeeef0; --surface:#ffffff; --surface-raised:#ffffff;
    --border:#e3e3e8; --border-strong:#d2d2da; --ink:#17171b; --muted:#68686f; --faint:#9a9aa3;
    --accent:#d4202c; --accent-hover:#b81824; --accent-ink:#ffffff; --accent-soft:#fdeced;
    --good:#0f9d58; --good-bg:#e6f6ec; --good-bd:#bfe8cd;
    --info:#2563eb; --info-bg:#e9f0fe; --info-bd:#c3d7fc;
    --bad:#d4202c; --bad-bg:#fdeced; --bad-bd:#f6c3c6;
    --warn:#b5790a; --warn-bg:#fbf0dc; --warn-bd:#f0d9a4;
    --shadow:0 1px 2px rgba(20,20,24,.05),0 1px 1px rgba(20,20,24,.04);
    --radius:14px; --radius-sm:10px;
    --font-th:"Noto Sans Thai",ui-sans-serif,system-ui,sans-serif;
    --font-la:"Inter",ui-sans-serif,system-ui,sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121214; --bg-subtle:#0c0c0e; --surface:#1a1a1d; --surface-raised:#1f1f23;
      --border:#2a2a2f; --border-strong:#38383f; --ink:#f5f5f7; --muted:#a3a3ad; --faint:#717178;
      --accent:#e5343f; --accent-hover:#f04852; --accent-ink:#ffffff; --accent-soft:#341418;
      --good:#34c777; --good-bg:#10291c; --good-bd:#1d4a30;
      --info:#5b8def; --info-bg:#101d33; --info-bd:#1e3458;
      --bad:#e5343f; --bad-bg:#331316; --bad-bd:#552127;
      --warn:#e0a940; --warn-bg:#30260f; --warn-bd:#4e3f18;
      --shadow:0 1px 2px rgba(0,0,0,.35),0 2px 10px rgba(0,0,0,.28);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121214; --bg-subtle:#0c0c0e; --surface:#1a1a1d; --surface-raised:#1f1f23;
    --border:#2a2a2f; --border-strong:#38383f; --ink:#f5f5f7; --muted:#a3a3ad; --faint:#717178;
    --accent:#e5343f; --accent-hover:#f04852; --accent-ink:#ffffff; --accent-soft:#341418;
    --good:#34c777; --good-bg:#10291c; --good-bd:#1d4a30;
    --info:#5b8def; --info-bg:#101d33; --info-bd:#1e3458;
    --bad:#e5343f; --bad-bg:#331316; --bad-bd:#552127;
    --warn:#e0a940; --warn-bg:#30260f; --warn-bd:#4e3f18;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 2px 10px rgba(0,0,0,.28);
    color-scheme: dark;
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-th),var(--font-la),system-ui,sans-serif;
    font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
    padding-left:max(0px, env(safe-area-inset-left,0px));
    padding-right:max(0px, env(safe-area-inset-right,0px));
  }
  h1,h2,h3{margin:0; text-wrap:balance}
  p{margin:0}
  button{font-family:inherit}
  a{color:inherit}
  table{border-collapse:collapse}
  ::selection{background:var(--accent); color:#fff}
  .num{font-variant-numeric:tabular-nums}

  .gutter{padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow)}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    height:38px; padding:0 14px; border-radius:var(--radius-sm); border:1px solid transparent;
    font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; transition:background-color .15s,border-color .15s;
  }
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .btn-sm{height:32px; padding:0 11px; font-size:12.5px}
  .btn-primary{background:var(--accent); color:var(--accent-ink)}
  .btn-primary:hover{background:var(--accent-hover)}
  .btn-primary:disabled{opacity:.5; cursor:not-allowed}
  .btn-secondary{background:var(--surface-raised); color:var(--ink); border-color:var(--border)}
  .btn-secondary:hover{border-color:var(--border-strong)}
  .btn-outline{background:transparent; color:var(--ink); border-color:var(--border)}
  .btn-outline:hover{background:var(--bg-subtle)}
  .btn-ghost{background:transparent; color:var(--muted); border-color:transparent}
  .btn-ghost:hover{background:var(--bg-subtle); color:var(--ink)}

  .field label{display:block; font-size:12.5px; font-weight:600; margin-bottom:5px}
  .input, select.input, textarea.input{
    width:100%; height:38px; border-radius:var(--radius-sm); border:1px solid var(--border);
    background:var(--surface); color:var(--ink); padding:0 11px; font:inherit; font-size:13.5px;
  }
  textarea.input{height:auto; padding:9px 11px}
  .input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
  .input:disabled{color:var(--muted); background:var(--bg-subtle)}

  .badge{display:inline-flex; align-items:center; gap:6px; border:1px solid; border-radius:999px; padding:4px 10px; font-size:11.5px; font-weight:600}
  .badge .dot{width:6px; height:6px; border-radius:999px; background:currentColor}
  .badge-good{color:var(--good); background:var(--good-bg); border-color:var(--good-bd)}
  .badge-info{color:var(--info); background:var(--info-bg); border-color:var(--info-bd)}
  .badge-bad{color:var(--bad); background:var(--bad-bg); border-color:var(--bad-bd)}
  .badge-neutral{color:var(--muted); background:var(--bg-subtle); border-color:var(--border)}
  .badge-demo{color:var(--warn); background:var(--warn-bg); border-color:var(--warn-bd); font-size:10.5px; padding:2px 8px}

  .shell{min-height:100%}
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:30; height:58px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border); background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(8px);
  }
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
  .brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:14px}
  .brand .mark{width:30px; height:30px; border-radius:9px; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px}

  .theme-toggle{display:inline-flex; gap:2px; border:1px solid var(--border); background:var(--bg-subtle); border-radius:999px; padding:2px}
  .theme-toggle button{width:28px; height:28px; border-radius:999px; border:none; background:transparent; color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer}
  .theme-toggle button.active{background:var(--surface); color:var(--accent); box-shadow:var(--shadow); border:1px solid var(--border)}

  /* admin layout */
  .admin{display:flex; min-height:100%}
  .rail{width:232px; flex-shrink:0; border-right:1px solid var(--border); background:var(--surface); display:flex; flex-direction:column}
  .rail .brand{padding:18px 16px}
  .rail nav, .drawer nav{display:flex; flex-direction:column; gap:3px; padding:0 10px}
  .rail nav a, .drawer nav a{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--radius-sm); color:var(--muted); font-size:13.5px; font-weight:600; text-decoration:none}
  .rail nav a:hover, .drawer nav a:hover{background:var(--bg-subtle); color:var(--ink)}
  .rail nav a.active, .drawer nav a.active{background:var(--accent-soft); color:var(--accent)}
  .rail .foot, .drawer .foot{padding:10px; border-top:1px solid var(--border); margin-top:10px}
  .admin-main{flex:1; min-width:0}
  .admin-content{padding:20px}
  @media (max-width:900px){ .rail{display:none} .admin-content{padding:16px} }

  .drawer-scrim{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50}
  .drawer{position:fixed; inset:0 auto 0 0; width:270px; background:var(--surface); z-index:51; display:flex; flex-direction:column; box-shadow:0 0 30px rgba(0,0,0,.3)}

  .grid{display:grid; gap:12px}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-4{grid-template-columns:repeat(4,1fr)}
  .grid-6{grid-template-columns:repeat(6,1fr)}
  @media (max-width:900px){ .grid-6{grid-template-columns:repeat(3,1fr)} .grid-4{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:560px){ .grid-6{grid-template-columns:repeat(2,1fr)} .grid-3,.grid-4{grid-template-columns:repeat(2,1fr)} .grid-2{grid-template-columns:1fr} }

  .stat{padding:14px}
  .stat .ic{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-bottom:8px; background:var(--bg-subtle); color:var(--muted)}
  .stat .v{font-size:22px; font-weight:800}
  .stat .l{font-size:11.5px; color:var(--muted)}

  table.tbl{width:100%; font-size:13px; border-collapse:collapse}
  table.tbl th{text-align:left; font-size:11px; color:var(--muted); font-weight:600; padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap}
  table.tbl td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle; white-space:nowrap}
  table.tbl tr:last-child td{border-bottom:none}
  .tbl-wrap{overflow-x:auto}
  .tbl-wrap table.tbl{width:max-content; min-width:100%}
  @media (max-width:860px){ .tbl-desktop{display:none} }
  @media (min-width:861px){ .cards-mobile{display:none} }

  .section-title{display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:800; margin-bottom:10px}
  .muted{color:var(--muted)}
  .faint{color:var(--faint)}
  .empty{border:1px dashed var(--border); border-radius:var(--radius); background:var(--bg-subtle); padding:34px 18px; text-align:center}
  .empty .t{font-weight:700; font-size:13.5px}
  .empty .d{color:var(--muted); font-size:12.5px; margin-top:3px}

  .modal-scrim{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:60; display:flex; align-items:center; justify-content:center; padding:16px}
  .modal{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:0 20px 60px rgba(0,0,0,.35); padding:20px; width:100%; max-width:480px; max-height:88vh; overflow:auto}
  .modal h3{font-size:16px; font-weight:800}
  .modal .sub{color:var(--muted); font-size:12.5px; margin-top:3px}
  .modal-foot{display:flex; justify-content:flex-end; gap:8px; margin-top:16px}
  .chiprow{display:flex; flex-wrap:wrap; gap:6px}
  .chip{height:32px; padding:0 11px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); color:var(--muted); font-size:12.5px; font-weight:600; cursor:pointer}
  .chip.active{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
  .summary-box{border-radius:var(--radius-sm); background:var(--accent-soft); color:var(--ink); padding:10px 12px; font-size:12.5px; margin-top:4px}

  .toast-host{position:fixed; top:calc(env(safe-area-inset-top,0px) + 70px); left:50%; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center}
  .toast{background:var(--surface-raised); border:1px solid var(--border); border-radius:var(--radius-sm); box-shadow:var(--shadow); padding:9px 14px; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:7px}
  .toast.good{color:var(--good)}
  .toast.bad{color:var(--bad)}
  .toast.info{color:var(--info)}

  .secret{display:inline-flex; align-items:center; gap:2px; font-family:var(--font-la),monospace; letter-spacing:.04em}
  .secret button{border:none; background:transparent; color:var(--faint); cursor:pointer; padding:9px; border-radius:7px; display:inline-flex; align-items:center; justify-content:center; min-width:34px; min-height:34px}
  .secret button:hover{background:var(--bg-subtle); color:var(--ink)}
  .secret button:active{background:var(--accent-soft); color:var(--accent)}

  .hero{max-width:640px}
  .pill{display:inline-flex; border:1px solid var(--border); background:var(--bg-subtle); color:var(--muted); border-radius:999px; padding:4px 11px; font-size:11.5px; font-weight:600}
  .plan-tile{border:1px solid var(--border); background:var(--bg-subtle); border-radius:var(--radius-sm); padding:16px 10px; text-align:center; display:flex; flex-direction:column; gap:4px}
  .plan-tile .price{color:var(--accent); font-weight:800; font-size:17px}

  .tabs{display:inline-flex; gap:2px; border:1px solid var(--border); background:var(--bg-subtle); border-radius:var(--radius-sm); padding:3px}
  .tabs button{height:30px; padding:0 12px; border-radius:8px; border:none; background:transparent; color:var(--muted); font-size:12.5px; font-weight:700; cursor:pointer}
  .tabs button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}

  .otp-code{font-family:var(--font-la),monospace; font-size:36px; font-weight:800; letter-spacing:.3em; text-align:center}
  .otp-code.expired{color:var(--faint); text-decoration:line-through}

  .link-btn{background:none;border:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .link-btn:hover{color:var(--accent)}
  [hidden]{display:none!important}

  footer.site{padding:26px 0; text-align:center; color:var(--faint); font-size:11.5px; border-top:1px solid var(--border)}
</style>

</head>
<body>
<div id="app"></div>
<div class="toast-host" id="toastHost"></div>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------- data */
var NOW = Date.now();
function hoursFromNow(h){ return new Date(NOW + h*3600*1000).toISOString(); }

var SHOP = { name:"Flixie House", tagline:"ศูนย์รวมบริการสตรีมมิงพรีเมียม จัดการง่าย โปร่งใส ตรวจสอบได้", contactLine:"https://line.me/ti/p/~phxjj2550", contactFacebook:"https://www.facebook.com/share/18NsTRxELm/?mibextid=wwXIfr" };
// สั่งซื้อผ่านการทักแชทหาแอดมินเท่านั้น (ไม่มีระบบสมัครสมาชิก/ล็อกอินของลูกค้า) ทุกคนที่เข้าหน้าร้านถือเป็น Guest
function siteFooterHTML(){
  return '<footer class="site">'+esc(SHOP.name)+' — '+esc(SHOP.tagline)+'<div style="margin-top:4px;font-size:10px;opacity:.65">สงวนลิขสิทธิ์ CATBYTE</div></footer>';
}
// ปุ่มติดต่อแอดมิน แสดงทั้งช่องทาง LINE และ Facebook คู่กันเสมอ
function contactButtonsHTML(opts){
  opts = opts || {};
  var cls2 = opts.secondaryClass || "btn-secondary";
  var wrap = opts.wrapStyle || "display:flex;gap:8px;flex-wrap:wrap";
  return '<div style="'+wrap+'">' +
    '<a href="'+esc(SHOP.contactLine)+'" target="_blank" rel="noreferrer" class="btn btn-primary'+(opts.full?" ":"")+'" style="'+(opts.btnStyle||"")+'">'+(opts.lineLabel||"ติดต่อแอดมินทาง LINE")+'</a>' +
    '<a href="'+esc(SHOP.contactFacebook)+'" target="_blank" rel="noreferrer" class="btn '+cls2+'" style="'+(opts.btnStyle||"")+'">'+(opts.fbLabel||"ติดต่อแอดมินทาง Facebook")+'</a>' +
  '</div>';
}
// แพ็กเกจแบ่งตามประเภทอุปกรณ์: มือถือ/ไอแพด/คอม กับ Smart TV/กล่อง TV/Android TV ราคาไม่เท่ากัน
var DEVICE_TYPES = [
  {id:"mobile", label:"มือถือ / ไอแพด / คอมพิวเตอร์", short:"มือถือ/คอม", emoji:"📱"},
  {id:"tv", label:"Smart TV / กล่อง TV / Android TV", short:"Smart TV", emoji:"📺"}
];
function deviceTypeLabel(id){ var d=DEVICE_TYPES.filter(function(x){return x.id===id;})[0]; return d?d.label:id; }
var PLANS = [
  {id:"m1",device:"mobile",name:"1 วัน",days:1,price:10},
  {id:"m7",device:"mobile",name:"7 วัน",days:7,price:49},
  {id:"m14",device:"mobile",name:"14 วัน",days:14,price:89},
  {id:"m30",device:"mobile",name:"30 วัน",days:30,price:109},
  {id:"t1",device:"tv",name:"1 วัน",days:1,price:19},
  {id:"t7",device:"tv",name:"7 วัน",days:7,price:69},
  {id:"t14",device:"tv",name:"14 วัน",days:14,price:109},
  {id:"t30",device:"tv",name:"30 วัน",days:30,price:159}
];
var PLAN_ID_SEQ = 1; // ใช้สร้างรหัสแพ็กเกจใหม่ที่ไม่ซ้ำกันตอนแอดมินกด "เพิ่มแพ็กเกจ"
// คำนวณราคาอัตโนมัติจากประเภทอุปกรณ์ + จำนวนวัน: ถ้าตรงกับแพ็กเกจที่ตั้งไว้ใช้ราคานั้นเลย
// ถ้าเป็นจำนวนวันกำหนดเอง จะเทียบบัญญัติไตรยางศ์ระหว่างสองแพ็กเกจที่ใกล้ที่สุดในหมวดอุปกรณ์เดียวกันให้อัตโนมัติ
function planPrice(deviceType, days){
  var list = PLANS.filter(function(p){ return p.device===deviceType; });
  if(list.length===0) list = PLANS.filter(function(p){ return p.device==="mobile"; });
  var exact = list.filter(function(p){ return p.days===days; })[0];
  if(exact) return exact.price;
  var sorted = list.slice().sort(function(a,b){ return a.days-b.days; });
  if(days<=sorted[0].days) return Math.max(1, Math.round(days*(sorted[0].price/sorted[0].days)));
  for(var i=0;i<sorted.length-1;i++){
    var a=sorted[i], b=sorted[i+1];
    if(days>a.days && days<b.days){
      var rate=(b.price-a.price)/(b.days-a.days);
      return Math.round(a.price + rate*(days-a.days));
    }
  }
  var last=sorted[sorted.length-1];
  return Math.round(days*(last.price/last.days));
}
var ACCOUNTS = [];
var CUSTOMERS = [];
var REVIEWS = [];
var NEW_REVIEW_DRAFTS = {};
function reviewDraft(cid){ return NEW_REVIEW_DRAFTS[cid] || (NEW_REVIEW_DRAFTS[cid]={rating:REVIEW_MAX, comment:""}); }
function reviewsForCustomer(cid){ return REVIEWS.filter(function(r){ return r.customerId===cid; }).sort(function(a,b){ return new Date(b.at)-new Date(a.at); }); }
// หน้า "รีวิว" แยกต่างหาก ไม่ได้รวมอยู่ในหน้ารายละเอียดลูกค้าอีกต่อไป
var REVIEW_UI = { mode:"existing", customerId: CUSTOMERS.length? CUSTOMERS[0].id : null, newName:"", editingId:null, editRating:0, editComment:"", search:"" };
var ACTIVITY_UI = { search:"" };
var REVIEW_MAX = 10; // คะแนนรีวิวเต็ม 10 แต้ม (เดิม 5)
function starsHTML(rating,size){
  var s="", sz=size||12;
  for(var i=1;i<=REVIEW_MAX;i++){ s += '<span style="color:'+(i<=rating?"#f5a623":"var(--border)")+';font-size:'+sz+'px;line-height:1">★</span>'; }
  return '<span style="display:inline-flex;gap:1px;flex-wrap:wrap">'+s+'</span>';
}
var MAILBOXES = [];
var PROFILES = [];
// ช่องทางที่ลูกค้าโอนเงินมาให้แอดมิน (เลือกตอนบันทึกการขายแต่ละรายการ)
var PAYMENT_METHODS = ["โอนเงิน","พร้อมเพย์","เงินสด","อื่นๆ"];
var RENTALS = [];
var RENEWALS = [];
// รายการ "ขายขาด" ที่ไม่ผูกกับรอบเช่า/วันหมดอายุ — บันทึกเองจากหน้า "รายได้"
var ONETIME_SALES = [];
var ACTIVITY = [];

/* -------------------------------------------------------------- ฐานข้อมูล (Cloudflare KV ผ่าน Pages Functions) */
// หน้าเว็บนี้ไม่มีข้อมูลในเครื่อง — ทุกครั้งที่แอดมินแก้ไขข้อมูล ระบบจะส่งข้อมูลทั้งหมดไปบันทึกที่ /api/state
// ถ้าเปิดเว็บจากที่ไม่มี backend (เช่น mirror บน GitHub Pages) การเรียก API จะล้มเหลวเงียบๆ และระบบจะทำงานแบบชั่วคราวในเครื่องนั้นเท่านั้น
var ADMIN_TOKEN_KEY = "flixie_admin_token";
function adminToken(){ try{ return localStorage.getItem(ADMIN_TOKEN_KEY)||""; }catch(e){ return ""; } }
function setAdminToken(t){ try{ if(t) localStorage.setItem(ADMIN_TOKEN_KEY,t); else localStorage.removeItem(ADMIN_TOKEN_KEY); }catch(e){} }
function decodeTokenPayload(token){
  try{
    var payloadB64=(token||"").split(".")[0]||"";
    var s=payloadB64.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='=';
    return JSON.parse(decodeURIComponent(escape(atob(s))));
  }catch(e){ return null; }
}
function hasValidLocalToken(){
  var t=adminToken(); if(!t) return false;
  var p=decodeTokenPayload(t);
  return !!(p && p.exp && p.exp>Date.now());
}
function clearAdminSession(){ setAdminToken(""); }
function snapshotState(){
  return {
    accounts:ACCOUNTS, customers:CUSTOMERS, reviews:REVIEWS, mailboxes:MAILBOXES,
    profiles:PROFILES, rentals:RENTALS, renewals:RENEWALS, onetimeSales:ONETIME_SALES,
    activity:ACTIVITY, plans:PLANS, planIdSeq:PLAN_ID_SEQ, deviceTypes:DEVICE_TYPES,
    paymentMethods:PAYMENT_METHODS, shop:SHOP
  };
}
function applySnapshot(s){
  if(!s || typeof s!=="object") return;
  function setArr(dst,src){ dst.length=0; if(Array.isArray(src)) Array.prototype.push.apply(dst,src); }
  setArr(ACCOUNTS, s.accounts); setArr(CUSTOMERS, s.customers); setArr(REVIEWS, s.reviews);
  setArr(MAILBOXES, s.mailboxes); setArr(PROFILES, s.profiles); setArr(RENTALS, s.rentals);
  setArr(RENEWALS, s.renewals); setArr(ONETIME_SALES, s.onetimeSales); setArr(ACTIVITY, s.activity);
  if(Array.isArray(s.plans)) setArr(PLANS, s.plans);
  if(typeof s.planIdSeq==="number") PLAN_ID_SEQ=s.planIdSeq;
  if(Array.isArray(s.deviceTypes)) setArr(DEVICE_TYPES, s.deviceTypes);
  if(Array.isArray(s.paymentMethods)) setArr(PAYMENT_METHODS, s.paymentMethods);
  if(s.shop && typeof s.shop==="object"){
    SHOP.name=s.shop.name||SHOP.name; SHOP.tagline=s.shop.tagline||SHOP.tagline;
    SHOP.contactLine=s.shop.contactLine||SHOP.contactLine; SHOP.contactFacebook=s.shop.contactFacebook||SHOP.contactFacebook;
  }
}
var PERSIST_TIMER=null, PERSIST_FAIL_WARNED=false;
function schedulePersist(){
  if(!adminToken()) return;
  if(PERSIST_TIMER) clearTimeout(PERSIST_TIMER);
  PERSIST_TIMER=setTimeout(persistStateNow, 600);
}
function persistStateNow(){
  var t=adminToken(); if(!t) return;
  fetch("/api/state", { method:"POST", headers:{"content-type":"application/json","authorization":"Bearer "+t}, body:JSON.stringify(snapshotState()) })
    .then(function(r){
      if(r.status===401){ clearAdminSession(); toast("เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่","bad"); go("login"); }
    })
    .catch(function(){
      if(!PERSIST_FAIL_WARNED){ PERSIST_FAIL_WARNED=true; toast("บันทึกขึ้นฐานข้อมูลไม่ได้ (ไม่พบระบบหลังบ้านบนโดเมนนี้) ข้อมูลจะหายเมื่อรีเฟรช","bad"); }
    });
}
function hydrateFromBackend(){
  fetch("/api/state").then(function(r){ return r.ok? r.json() : null; }).then(function(data){
    if(data){ applySnapshot(data); seedNotifySeen(); render(true); }
  }).catch(function(){ /* ไม่มีระบบหลังบ้านบนโดเมนนี้ (เช่น mirror บน GitHub Pages) — ทำงานต่อแบบชั่วคราวในเครื่อง */ });
}

function mailbox(id){ return byId(MAILBOXES,id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

var THAI_M=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
function toBangkok(d){ return new Date(d.getTime() + 7*3600*1000); }
function fmtDT(iso){ var d=toBangkok(new Date(iso)); return d.getUTCDate()+" "+THAI_M[d.getUTCMonth()]+" "+d.getUTCFullYear()+" เวลา "+String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0")+" น."; }
function fmtD(iso){ var d=toBangkok(new Date(iso)); return d.getUTCDate()+" "+THAI_M[d.getUTCMonth()]+" "+d.getUTCFullYear(); }
function fmtT(iso){ var d=toBangkok(new Date(iso)); return String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0")+" น."; }
// คีย์วันตามปฏิทินกรุงเทพฯ (ไม่ขึ้นกับโซนเวลาเครื่องผู้ใช้) ใช้จัดกลุ่มยอดขายรายวัน
function dayKey(iso){ var d=toBangkok(new Date(iso)); return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); }
function dayLabel(key){ var parts=key.split("-"); var d=new Date(Date.UTC(+parts[0],+parts[1]-1,+parts[2])); return d.getUTCDate()+" "+THAI_M[d.getUTCMonth()]+" "+d.getUTCFullYear(); }
function fmtMoney(n){ return "฿"+Math.round(n).toLocaleString("th-TH"); }
function remaining(expIso,nowMs){
  var diff=new Date(expIso).getTime()-nowMs, abs=Math.abs(diff);
  var days=Math.floor(abs/86400000), hrs=Math.floor((abs%86400000)/3600000), mins=Math.floor((abs%3600000)/60000);
  var parts=[]; if(days>0) parts.push(days+" วัน"); if(hrs>0||days>0) parts.push(hrs+" ชม."); parts.push(mins+" นาที");
  return (diff>=0? "เหลืออีก ":"เลยเวลามาแล้ว ")+parts.join(" ");
}
function deriveStatus(rentalObj){
  if(!rentalObj || rentalObj.closedAt) return "AVAILABLE";
  return Date.now() >= new Date(rentalObj.expiresAt).getTime() ? "EXPIRED" : "OCCUPIED";
}
var STATUS_LABEL={AVAILABLE:"ว่าง",OCCUPIED:"ไม่ว่าง",EXPIRED:"หมดเวลา"};
function currentRentalOf(profileObj){
  if(!profileObj.rentalId) return null;
  var r=rental(profileObj.rentalId);
  return (r && !r.closedAt) ? r : null;
}
function profileRow(p){
  var r=currentRentalOf(p), acc=account(p.accountId), status=deriveStatus(r);
  var cust=r?customer(r.customerId):null;
  return {profile:p, account:acc, rental:r, status:status, customer:cust};
}
function allRows(){ return PROFILES.map(profileRow); }

/* ------------------------------------------------------------- toast */
function toast(msg,kind){
  var host=document.getElementById("toastHost");
  var el=document.createElement("div");
  el.className="toast "+(kind||"good");
  el.textContent=msg;
  host.appendChild(el);
  setTimeout(function(){ el.style.transition="opacity .25s"; el.style.opacity="0"; setTimeout(function(){ el.remove(); },250); }, 2600);
}

/* -------------------------------------------- แจ้งเตือนจอหมดเวลา (เดโม่) */
// เดโม่นี้แจ้งเตือนได้เฉพาะตอนเปิดแท็บเบราว์เซอร์ค้างไว้เท่านั้น (ใช้ Notification API ของเบราว์เซอร์)
// การแจ้งเตือนเข้าโทรศัพท์แบบ push จริงตอนปิดแอป/ปิดแท็บ ต้องมีเซิร์ฟเวอร์ backend
// (web push + service worker หรือเชื่อม LINE Notify/SMS) ซึ่งเว็บ static บน GitHub Pages ทำเองไม่ได้
var NOTIFY = { seen:{}, permission:(typeof Notification!=="undefined"?Notification.permission:"unsupported") };
function currentExpiredRentalIds(){
  return allRows().filter(function(r){ return r.status==="EXPIRED" && r.rental; }).map(function(r){ return r.rental.id; });
}
function currentExpiringSoonRentalIds(){
  return allRows().filter(function(r){ return r.status==="OCCUPIED" && r.rental && (new Date(r.rental.expiresAt).getTime()-Date.now())/3600000<=24; }).map(function(r){ return r.rental.id; });
}
function notifyBellHTML(){
  var count = currentExpiredRentalIds().length + currentExpiringSoonRentalIds().length;
  return '<button class="btn btn-ghost btn-sm" id="notifyBell" title="การแจ้งเตือน" style="position:relative">'+icon('bell') +
    (count>0? '<span style="position:absolute;top:2px;right:2px;background:var(--bad);color:#fff;border-radius:999px;min-width:15px;height:15px;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 3px">'+count+'</span>' : '') +
  '</button>';
}
function pushBrowserNotification(title,body,tag){
  if(NOTIFY.permission==="granted"){
    try{ new Notification(title, {body:body, tag:tag}); }catch(e){}
  }
}
function checkExpiryNotifications(){
  var expIds = currentExpiredRentalIds();
  var freshExp = expIds.filter(function(id){ return !NOTIFY.seen["exp:"+id]; });
  expIds.forEach(function(id){ NOTIFY.seen["exp:"+id]=true; });
  freshExp.forEach(function(id){
    var r=rental(id); if(!r) return;
    var p=profile(r.profileId), cust=customer(r.customerId);
    var msg=(p?p.name:"โปรไฟล์")+' ('+(cust?cust.name:"-")+') หมดเวลาแล้ว';
    toast(msg,"bad");
    pushBrowserNotification("Flixie House — จอหมดเวลา", msg, "exp-"+id);
  });

  var soonIds = currentExpiringSoonRentalIds();
  var freshSoon = soonIds.filter(function(id){ return !NOTIFY.seen["soon:"+id]; });
  soonIds.forEach(function(id){ NOTIFY.seen["soon:"+id]=true; });
  freshSoon.forEach(function(id){
    var r=rental(id); if(!r) return;
    var p=profile(r.profileId), cust=customer(r.customerId);
    var msg=(p?p.name:"โปรไฟล์")+' ('+(cust?cust.name:"-")+') ใกล้หมดเวลาภายใน 24 ชม.';
    toast(msg,"info");
    pushBrowserNotification("Flixie House — ใกล้หมดเวลา", msg, "soon-"+id);
  });
}
function requestNotifyPermission(){
  if(typeof Notification==="undefined"){ toast("เบราว์เซอร์นี้ไม่รองรับการแจ้งเตือน","bad"); return; }
  Notification.requestPermission().then(function(perm){
    NOTIFY.permission=perm;
    if(perm==="granted") toast("เปิดการแจ้งเตือนแล้ว — ต้องเปิดแท็บนี้ค้างไว้เพื่อรับแจ้งเตือน","good");
    else toast("ไม่ได้รับอนุญาตให้แจ้งเตือน","bad");
    render(true);
  });
}

// คัดลอกข้อความแบบรองรับเบราว์เซอร์ในแอป (เช่น LINE/Facebook) ที่บางทีปิดกั้น navigator.clipboard
function copyToClipboard(text, done){
  function fallback(){
    var ok=false;
    try{
      var ta=document.createElement("textarea");
      ta.value=text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0"; ta.style.left="-9999px";
      document.body.appendChild(ta); ta.focus(); ta.select();
      ok=document.execCommand("copy");
      document.body.removeChild(ta);
    }catch(e){ ok=false; }
    if(done) done(ok);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ if(done) done(true); }).catch(fallback);
  } else {
    fallback();
  }
}

        '<button class="btn btn-primary" type="submit" style="margin-top:2px">เข้าสู่ระบบ</button>' +
      '</form>' +
    '</div>' +
    '<a href="#home" class="link-btn" style="margin-top:14px;font-size:12px">'+icon('back')+'กลับหน้าร้าน</a>' +
  '</main>' +

}
function mountLogin(){
  document.getElementById("loginForm").onsubmit=function(e){
    e.preventDefault();
    var email=document.getElementById("le").value.trim(), pass=document.getElementById("lp").value;
    if(!email||!pass){ toast("กรุณากรอกอีเมลและรหัสผ่าน","bad"); return; }
    var btn=e.target.querySelector('button[type=submit]');
    if(btn){ btn.disabled=true; }
    fetch("/api/login", { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({email:email,password:pass}) })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(data){ return {ok:r.ok, data:data}; }); })
      .then(function(res){
        if(btn){ btn.disabled=false; }
        if(res.ok && res.data && res.data.token){
          setAdminToken(res.data.token);
          toast("เข้าสู่ระบบสำเร็จ","good");
          hydrateFromBackend();
          setTimeout(function(){ go("admin"); }, 350);
        } else {
          toast("อีเมลหรือรหัสผ่านไม่ถูกต้อง","bad");
        }
      })
      .catch(function(){
        if(btn){ btn.disabled=false; }
        toast("เชื่อมต่อระบบหลังบ้านไม่ได้ ลองใหม่อีกครั้ง","bad");
      });
  };
}

function adminActiveKey(route){
  if(route==="admin") return "admin";
  if(route.indexOf("admin-account-")===0) return "admin-accounts";
  if(route.indexOf("admin-customer-")===0 && route!=="admin-customers") return "admin-customers";
  for(var i=0;i<ADMIN_NAV.length;i++) if(route===ADMIN_NAV[i].href) return ADMIN_NAV[i].href;
  return "admin";
}
function railNavHTML(active){

}

function mountAdminShellEvents(){

  var scrim=document.getElementById("drawerScrim");
  if(scrim) scrim.onclick=function(){ STATE.drawerOpen=false; render(); };

function viewAdminDashboard(){
  var rows=allRows();
  var avail=rows.filter(function(r){return r.status==="AVAILABLE"}).length;
  var occ=rows.filter(function(r){return r.status==="OCCUPIED"}).length;
  var exp=rows.filter(function(r){return r.status==="EXPIRED"}).length;
  var soon=rows.filter(function(r){ if(r.status!=="OCCUPIED") return false; return (new Date(r.rental.expiresAt).getTime()-Date.now())/3600000<=24; });
  var awaiting=rows.filter(function(r){return r.status==="EXPIRED"});
  var stats=[
    ["บัญชี Netflix ทั้งหมด",ACCOUNTS.length],["โปรไฟล์ทั้งหมด",rows.length],
    ["โปรไฟล์ว่าง",avail],["โปรไฟล์ไม่ว่าง",occ],["โปรไฟล์หมดเวลา",exp],["ลูกค้าทั้งหมด",CUSTOMERS.length]
  ];
  var statCards = stats.map(function(s){ return '<div class="card stat"><div class="v num">'+s[1]+'</div><div class="l">'+s[0]+'</div></div>'; }).join("");
  var soonHtml = soon.length===0? emptyState("ไม่มีรายการใกล้หมดเวลา","รายการไม่ว่างทั้งหมดยังเหลือเวลามากกว่า 24 ชั่วโมง") :
    '<div>'+soon.map(function(r){ return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px"><div><div style="font-weight:600">'+esc(r.profile.name)+' · '+esc(r.account.name)+'</div><div class="muted" style="font-size:11.5px">'+esc(r.customer.name)+'</div></div>'+countdownSpan(r.rental.expiresAt,false)+'</div>'; }).join("")+'</div>';
  var awaitHtml = awaiting.length===0? emptyState("ไม่มีรายการรอคืนเป็นว่าง") :
    '<div>'+awaiting.map(function(r){ return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px"><div><div style="font-weight:600">'+esc(r.profile.name)+' · '+esc(r.account.name)+'</div><div class="muted" style="font-size:11.5px">'+esc(r.customer.name)+'</div></div>'+statusBadge("EXPIRED")+'</div>'; }).join("")+'</div>';
  var activityHtml = ACTIVITY.slice().sort(function(a,b){return new Date(b.at)-new Date(a.at)}).slice(0,6).map(function(a){
    return '<div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px"><div><div>'+esc(a.detail)+'</div><div class="muted" style="font-size:11px">โดย '+esc(a.actor)+' · '+esc(a.target)+'</div></div><div class="faint" style="font-size:11px;white-space:nowrap">'+fmtDT(a.at)+'</div></div>';
  }).join("");

  var body = '<div style="display:flex;flex-direction:column;gap:18px">' +
    '<div class="grid grid-6">'+statCards+'</div>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
      '<a href="#admin-accounts" class="btn btn-primary btn-sm">'+icon('plus')+'เพิ่มบัญชี Netflix</a>' +
      '<a href="#admin-accounts" class="btn btn-secondary btn-sm">เพิ่มลูกค้าเข้าโปรไฟล์</a>' +
      '<a href="#admin-mailboxes" class="btn btn-secondary btn-sm">จัดการอีเมล</a>' +
      '<a href="#admin-rentals" class="btn btn-outline btn-sm">ดูรายการหมดเวลา</a>' +
    '</div>' +
    '<div class="grid grid-2">' +
      '<div class="card" style="padding:16px"><div class="section-title">รายการที่จะหมดเวลาภายใน 24 ชั่วโมง</div>'+soonHtml+'</div>' +
      '<div class="card" style="padding:16px"><div class="section-title">รายการที่หมดเวลาแล้วและรอคืนเป็นว่าง</div>'+awaitHtml+'</div>' +
    '</div>' +
    '<div class="card" style="padding:16px"><div class="section-title">กิจกรรมล่าสุด</div>'+activityHtml+'</div>' +
  '</div>';
  return adminShell("admin","แดชบอร์ด",body);
}

var SECRET_MASK = "••••••••"; // ค่าที่แสดงเป็นค่าเริ่มต้นสำหรับข้อมูลที่ต้องซ่อนไว้ (อีเมล/รหัสผ่าน/ชื่อลูกค้า) กดรูปตาเพื่อดูค่าจริง
function secretHTML(real,masked){
  var id="s"+Math.random().toString(36).slice(2,9);
  masked = masked==null ? SECRET_MASK : masked;
  return '<span class="secret" data-real="'+esc(real)+'" data-masked="'+esc(masked)+'" id="'+id+'"><span class="val">'+esc(masked)+'</span>' +
    '<button data-secret-toggle="'+id+'">'+icon('eye')+'</button>' +
    '<button data-secret-copy="'+id+'">'+icon('copy')+'</button></span>';
}
function mountSecrets(){
  document.querySelectorAll('[data-secret-toggle]').forEach(function(btn){
    btn.onclick=function(){
      var wrap=document.getElementById(btn.getAttribute("data-secret-toggle"));
      var val=wrap.querySelector(".val");
      var showing = val.textContent===wrap.getAttribute("data-real");
      val.textContent = showing? wrap.getAttribute("data-masked") : wrap.getAttribute("data-real");
      if(!showing){ logActivity("SECRET_VIEWED","เปิดดูข้อมูลสำคัญที่ถูกซ่อนไว้ (อีเมล/รหัสผ่าน/ชื่อลูกค้า)","-"); toast("เปิดดูข้อมูลสำคัญ — บันทึกลงประวัติกิจกรรมแล้ว","info"); }
    };
  });
  document.querySelectorAll('[data-secret-copy]').forEach(function(btn){
    btn.onclick=function(){
      var wrap=document.getElementById(btn.getAttribute("data-secret-copy"));
      copyToClipboard(wrap.getAttribute("data-real"), function(ok){ toast(ok?"คัดลอกแล้ว":"คัดลอกไม่สำเร็จ ลองแตะค้างที่ข้อความแทน","good"); });
    };
  });
}

function deleteAccount(accId){
  var acc=account(accId); if(!acc) return false;
  var hasActive = allRows().filter(function(r){return r.account.id===accId;}).some(function(r){return r.status!=="AVAILABLE";});
  if(hasActive){ toast("ห้ามลบบัญชีที่ยังมีรายการใช้งานปัจจุบัน","bad"); return false; }
  if(!confirm('ยืนยันลบบัญชี "'+acc.name+'"?\nโปรไฟล์ทั้งหมดในบัญชีนี้จะถูกลบไปด้วย และไม่สามารถย้อนกลับได้')) return false;
  var idx=ACCOUNTS.findIndex(function(a){return a.id===acc.id;});
  if(idx>=0) ACCOUNTS.splice(idx,1);
  for(var i=PROFILES.length-1;i>=0;i--){ if(PROFILES[i].accountId===acc.id) PROFILES.splice(i,1); }
  toast("ลบบัญชี "+acc.name+" แล้ว","good");
  return true;
}
function deleteCustomer(custId){
  var c=customer(custId); if(!c) return false;
  var activeCount = RENTALS.filter(function(r){return r.customerId===custId && !r.closedAt;}).length;
  if(activeCount>0){ toast("ห้ามลบลูกค้าที่ยังมีบริการใช้งานอยู่","bad"); return false; }
  if(!confirm('ยืนยันลบลูกค้า "'+c.name+'"?\nข้อมูลและประวัติที่เกี่ยวข้องจะหายไป และไม่สามารถย้อนกลับได้')) return false;
  var idx=CUSTOMERS.findIndex(function(x){return x.id===c.id;});
  if(idx>=0) CUSTOMERS.splice(idx,1);
  toast("ลบลูกค้า "+c.name+" แล้ว","good");
  return true;
}

var ADMIN_UI = { search:"", statusFilter:"ALL", collapsed:{} };

    if(!q) return true;

  });
  var groups = ACCOUNTS.map(function(acc){ return {account:acc, rows: filtered.filter(function(r){return r.account.id===acc.id})}; }).filter(function(g){return g.rows.length>0});

  var groupsHtml = groups.map(function(g){
    var collapsed = !!ADMIN_UI.collapsed[g.account.id];
    return '<div class="card" style="padding:0;overflow:hidden;margin-bottom:14px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border);background:var(--bg-subtle);cursor:pointer" data-toggle-group="'+g.account.id+'">' +
        '<div><div style="font-weight:700;font-size:13px">'+esc(g.account.name)+'</div><div class="muted" style="font-size:11.5px">'+esc(g.account.email)+'</div></div>' +

          '<button class="btn btn-outline btn-sm" data-editacc="'+g.account.id+'" title="แก้ไขบัญชี">'+icon('edit')+'</button>' +
          '<button class="btn btn-outline btn-sm" data-delacc="'+g.account.id+'" style="color:var(--bad);border-color:var(--bad-bd)" title="ลบบัญชี">'+icon('trash')+'</button>' +
        '</div>' +
      '</div>' +
      (collapsed? '' :
        '<div class="tbl-wrap tbl-desktop"><table class="tbl"><thead><tr><th>โปรไฟล์</th><th>อีเมล Netflix</th><th>รหัสผ่าน</th><th>PIN</th><th>สถานะ</th><th>ลูกค้าที่เข้า</th><th>วันเริ่ม</th><th>วันหมดอายุ</th><th>เช่ากี่วัน</th><th>อุปกรณ์</th><th>จัดการ</th></tr></thead><tbody>'+accountsTableRows(g.rows)+'</tbody></table></div>' +
        '<div class="cards-mobile">'+accountsCardsHTML(g.rows)+'</div>'
      ) +
    '</div>';
  }).join("") || emptyState("ไม่พบโปรไฟล์ที่ตรงกับเงื่อนไข");

  var statsHtml = '<div class="grid grid-4">' +
      statCard(ACCOUNTS.length,"บัญชี Netflix ทั้งหมด") +
      statCard(PROFILES.length,"โปรไฟล์ (จอ) ทั้งหมด") +
      statCard(rows.filter(function(r){return r.status==="AVAILABLE";}).length,"โปรไฟล์ว่าง","good") +
      statCard(rows.filter(function(r){return r.status==="OCCUPIED";}).length,"โปรไฟล์ไม่ว่าง","info") +
      statCard(rows.filter(function(r){return r.status==="EXPIRED";}).length,"โปรไฟล์หมดเวลา","bad") +
      statCard(CUSTOMERS.length,"ลูกค้าทั้งหมด") +
      statCard(REVIEWS.length,"รีวิวทั้งหมด") +
    '</div>';

  var body = '<div style="display:flex;flex-direction:column;gap:14px">' +
    statsHtml +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">' +
      '<p class="muted" style="font-size:12.5px">'+ACCOUNTS.length+' บัญชี · '+PROFILES.length+' โปรไฟล์</p>' +
      '<button class="btn btn-primary btn-sm" id="addAccountBtn">'+icon('plus')+'เพิ่มบัญชี Netflix</button>' +
    '</div>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
      '<input class="input" id="acctSearch" placeholder="ค้นหาจากชื่อโปรไฟล์ อีเมลบัญชี หรือชื่อลูกค้า" style="flex:1;min-width:220px" value="'+esc(ADMIN_UI.search)+'">' +
      '<select class="input" id="acctFilter" style="width:160px">' +
        ['ALL,ทุกสถานะ','AVAILABLE,ว่าง','OCCUPIED,ไม่ว่าง','EXPIRED,หมดเวลา'].map(function(o){ var v=o.split(","); return '<option value="'+v[0]+'" '+(ADMIN_UI.statusFilter===v[0]?"selected":"")+'>'+v[1]+'</option>'; }).join("") +

function mountAdminAccounts(){
  var search=document.getElementById("acctSearch");
  if(search){ search.oninput=function(){ ADMIN_UI.search=search.value; render(true); }; }
  var filt=document.getElementById("acctFilter");
  if(filt){ filt.onchange=function(){ ADMIN_UI.statusFilter=filt.value; render(); }; }
  document.querySelectorAll('[data-toggle-group]').forEach(function(el){
    el.onclick=function(e){ if(e.target.closest("[data-stop-toggle]")) return; var id=el.getAttribute("data-toggle-group"); ADMIN_UI.collapsed[id]=!ADMIN_UI.collapsed[id]; render(); };
  });
  document.getElementById("addAccountBtn").onclick=function(){ STATE.modal={type:"addAccount", name:"", email:"", pass:"", note:"", profileCount:5}; render(); };
  document.querySelectorAll('[data-editacc]').forEach(function(btn){
    btn.onclick=function(e){ e.stopPropagation(); openEditAccountModal(btn.getAttribute("data-editacc")); };
  });
  document.querySelectorAll('[data-delacc]').forEach(function(btn){
    btn.onclick=function(e){ e.stopPropagation(); if(deleteAccount(btn.getAttribute("data-delacc"))) render(true); };
  });
  document.querySelectorAll('[data-assign]').forEach(function(btn){ btn.onclick=function(){ openAssignModal(btn.getAttribute("data-assign")); }; });
  document.querySelectorAll('[data-renew]').forEach(function(btn){ btn.onclick=function(){ openRenewModal(btn.getAttribute("data-renew")); }; });
  document.querySelectorAll('[data-release]').forEach(function(btn){ btn.onclick=function(){ openReleaseConfirm(btn.getAttribute("data-release")); }; });
  document.querySelectorAll('[data-toggle-field-visibility]').forEach(function(btn){
    btn.onclick=function(){
      var field=btn.getAttribute("data-toggle-field-visibility"), id=btn.getAttribute("data-toggle-field-id");
      var input=document.querySelector('[data-edit-field="'+field+'"][data-edit-id="'+id+'"]');
      if(!input) return;
      input.type = input.type==="password" ? "text" : "password";
    };
  });
  document.querySelectorAll('[data-save-field]').forEach(function(btn){
    btn.onclick=function(){
      var field=btn.getAttribute("data-save-field"), id=btn.getAttribute("data-save-id");
      var input=document.querySelector('[data-edit-field="'+field+'"][data-edit-id="'+id+'"]');
      if(!input) return;
      if(field==="days"){
        var r=rental(id);
        if(r){ r.days=Number(input.value); toast("บันทึกจำนวนวันที่เช่าแล้ว","good"); render(true); }
        return;
      }
      var p=profile(id);
      if(p){ p[field]=input.value.trim(); toast((field==="pin"?"บันทึก PIN แล้ว":"บันทึกอุปกรณ์แล้ว"),"good"); render(true); }
    };
  });
  document.querySelectorAll('[data-copy-field]').forEach(function(btn){
    btn.onclick=function(){
      var field=btn.getAttribute("data-copy-field"), id=btn.getAttribute("data-copy-id");
      var input=document.querySelector('[data-edit-field="'+field+'"][data-edit-id="'+id+'"]');
      var val=input?input.value:"";
      if(!val){ toast("ยังไม่มีข้อมูลให้คัดลอก","info"); return; }
      copyToClipboard(val, function(ok){ toast(ok?"คัดลอกแล้ว":"คัดลอกไม่สำเร็จ ลองแตะค้างที่ข้อความแทน","good"); });
    };
  });
  mountCopyText();
  mountSecrets();
}
function mountCopyText(){
  document.querySelectorAll('[data-copy-text]').forEach(function(btn){
    btn.onclick=function(){
      copyToClipboard(btn.getAttribute("data-copy-text"), function(ok){ toast(ok?"คัดลอกแล้ว":"คัดลอกไม่สำเร็จ ลองแตะค้างที่ข้อความแทน","good"); });

  });
}

function modalWrap(title,sub,body,foot){
  return '<div class="modal-scrim" id="modalScrim"><div class="modal">' +
    '<div style="display:flex;justify-content:space-between;align-items:flex-start"><div><h3>'+esc(title)+'</h3>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div><button class="btn btn-ghost btn-sm" data-close>'+icon('close')+'</button></div>' +
    '<div style="display:flex;flex-direction:column;gap:14px;margin-top:14px">'+body+'</div>' +
    '<div class="modal-foot">'+foot+'</div>' +
  '</div></div>';
}
function mountModal(){
  var m=STATE.modal; if(!m) return;
  var scrim=document.getElementById("modalScrim");
  scrim.onclick=function(e){ if(e.target===scrim) closeModal(); };
  document.querySelectorAll('[data-close]').forEach(function(b){ b.onclick=closeModal; });

  if(m.type==="assign"){
    document.querySelectorAll('[data-amode]').forEach(function(b){ b.onclick=function(){ m.mode=b.getAttribute("data-amode"); render(); }; });
    document.querySelectorAll('[data-adevice]').forEach(function(b){ b.onclick=function(){ m.deviceType=b.getAttribute("data-adevice"); render(); }; });
    document.querySelectorAll('[data-days]').forEach(function(b){ b.onclick=function(){ m.days=Number(b.getAttribute("data-days")); render(); }; });
    document.querySelectorAll('[data-apay]').forEach(function(b){ b.onclick=function(){ m.paymentMethod=b.getAttribute("data-apay"); render(); }; });
    var cd=document.getElementById("assignCustomDays");
    if(cd) cd.oninput=function(){ var n=Number(cd.value); if(Number.isInteger(n)&&n>=1&&n<=365){ m.days=n; render(); } };
    var sel=document.getElementById("assignCust"); if(sel) sel.onchange=function(){ m.customerId=sel.value; };
    var nn=document.getElementById("assignNewName"); if(nn) nn.oninput=function(){ m.newName=nn.value; };
    document.getElementById("assignConfirm").onclick=function(){
      var custId=m.mode==="existing"? (document.getElementById("assignCust")?document.getElementById("assignCust").value:m.customerId) : null;
      if(m.mode==="new"){
        var name=(document.getElementById("assignNewName")||{}).value||m.newName;
        if(!name||!name.trim()){ toast("กรุณาระบุชื่อลูกค้าใหม่","bad"); return; }
        var nc={id:"cus-new-"+Date.now(), name:name.trim(), email:name.trim().replace(/\s+/g,"").toLowerCase()+"@example.com", contact:"", note:"", pin:false, since:new Date().toISOString()};
        CUSTOMERS.push(nc); custId=nc.id;
      }
      var p=profile(m.profileId);
      var start=new Date(), exp=new Date(start.getTime()+m.days*86400000);
      var nr={id:"rt-new-"+Date.now(), profileId:p.id, customerId:custId, startedAt:start.toISOString(), expiresAt:exp.toISOString(), days:m.days, deviceType:m.deviceType, price:planPrice(m.deviceType,m.days), paymentMethod:m.paymentMethod, closedAt:null};
      RENTALS.push(nr); p.rentalId=nr.id;
      var custForLog=customer(custId);
      logActivity("CUSTOMER_ASSIGNED", "มอบหมายโปรไฟล์ "+p.name+" ให้ "+(custForLog?custForLog.name:"-")+" ("+m.days+" วัน, "+fmtMoney(nr.price)+")", p.name);
      closeModal();
      toast("มอบหมายโปรไฟล์ให้ลูกค้าแล้ว ยอดขาย "+fmtMoney(nr.price)+" ถูกบันทึกในหน้า “รายได้” แล้ว","good");
    };
  }
  if(m.type==="renew"){
    document.querySelectorAll('[data-rdevice]').forEach(function(b){ b.onclick=function(){ m.deviceType=b.getAttribute("data-rdevice"); render(); }; });
    document.querySelectorAll('[data-rdays]').forEach(function(b){ b.onclick=function(){ m.days=Number(b.getAttribute("data-rdays")); render(); }; });
    document.querySelectorAll('[data-rpay]').forEach(function(b){ b.onclick=function(){ m.paymentMethod=b.getAttribute("data-rpay"); render(); }; });
    var cd2=document.getElementById("renewCustomDays");
    if(cd2) cd2.oninput=function(){ var n=Number(cd2.value); if(Number.isInteger(n)&&n>=1&&n<=365){ m.days=n; render(); } };
    document.getElementById("renewConfirm").onclick=function(){
      var r=rental(m.rentalId);
      var isExpired = deriveStatus(r)==="EXPIRED";
      var base = isExpired? new Date() : new Date(r.expiresAt);
      var prevExpires = r.expiresAt;
      var price = planPrice(m.deviceType,m.days);
      r.expiresAt = new Date(base.getTime()+m.days*86400000).toISOString();
      r.deviceType = m.deviceType;
      r.paymentMethod = m.paymentMethod;
      RENEWALS.push({ id:"rn-new-"+Date.now(), rentalId:r.id, prevExpires:prevExpires, newExpires:r.expiresAt, days:m.days, price:price, paymentMethod:m.paymentMethod, actor:"super@admin", at:new Date().toISOString() });
      var pForLog=profile(r.profileId);
      logActivity("RENEWED", "ต่ออายุ "+(pForLog?pForLog.name:r.profileId)+" เพิ่ม "+m.days+" วัน ("+fmtMoney(price)+")", pForLog?pForLog.name:"-");
      closeModal();
      toast("ต่ออายุเพิ่ม "+m.days+" วันแล้ว ยอดขาย "+fmtMoney(price)+" ถูกบันทึกในหน้า “รายได้” แล้ว","good");
    };
  }
  if(m.type==="release"){
    document.getElementById("releaseConfirm").onclick=function(){
      var r=rental(m.rentalId); r.closedAt=new Date().toISOString();
      var p=profile(r.profileId); p.rentalId=null;
      logActivity("RELEASED", "คืนโปรไฟล์ "+p.name+" เป็นว่าง", p.name);
      closeModal();
      toast("คืนโปรไฟล์เป็นว่างแล้ว ประวัติเดิมยังถูกเก็บไว้","good");
    };
  }
  if(m.type==="onetime"){
    document.querySelectorAll('[data-omode]').forEach(function(b){ b.onclick=function(){ m.mode=b.getAttribute("data-omode"); render(); }; });
    document.querySelectorAll('[data-opay]').forEach(function(b){ b.onclick=function(){ m.paymentMethod=b.getAttribute("data-opay"); render(); }; });
    document.querySelectorAll('[data-odevice]').forEach(function(b){ b.onclick=function(){
      m.deviceType=b.getAttribute("data-odevice");
      if(!m.amountTouched) m.amount=planPrice(m.deviceType,m.days);
      render();
    }; });
    document.querySelectorAll('[data-odays]').forEach(function(b){ b.onclick=function(){
      m.days=Number(b.getAttribute("data-odays"));
      if(!m.amountTouched) m.amount=planPrice(m.deviceType,m.days);
      render();
    }; });
    var ocd=document.getElementById("oneCustomDays");
    if(ocd) ocd.oninput=function(){ var n=Number(ocd.value); if(Number.isInteger(n)&&n>=1&&n<=365){ m.days=n; if(!m.amountTouched) m.amount=planPrice(m.deviceType,m.days); render(); } };
    var oc=document.getElementById("oneCust"); if(oc) oc.onchange=function(){ m.customerId=oc.value; };
    var onn=document.getElementById("oneNewName"); if(onn) onn.oninput=function(){ m.newName=onn.value; };
    var on2=document.getElementById("oneNote"); if(on2) on2.oninput=function(){ m.note=on2.value; };
    var oa=document.getElementById("oneAmount"); if(oa) oa.oninput=function(){ m.amount=oa.value; m.amountTouched=true; };
    document.getElementById("oneConfirm").onclick=function(){
      var amount=Number((document.getElementById("oneAmount")||{}).value||m.amount);
      if(!amount || amount<=0){ toast("กรุณากรอกจำนวนเงินให้ถูกต้อง","bad"); return; }
      var note=((document.getElementById("oneNote")||{}).value||m.note||"").trim() || "ขายขาด (ไม่ระบุรายละเอียด)";
      var customerName;
      if(m.mode==="existing"){
        var c=customer((document.getElementById("oneCust")||{}).value||m.customerId);
        customerName = c? c.name : "-";
      }else{
        var nm=((document.getElementById("oneNewName")||{}).value||m.newName||"").trim();
        if(!nm){ toast("กรุณาระบุชื่อลูกค้า","bad"); return; }
        customerName = nm;
      }
      if(m.editId){
        var existing=byId(ONETIME_SALES,m.editId);
        if(existing){ existing.customerName=customerName; existing.note=note; existing.amount=amount; existing.paymentMethod=m.paymentMethod; }
        closeModal();
        toast("บันทึกการแก้ไขรายการขายขาดแล้ว","good");
      }else{
        ONETIME_SALES.unshift({ id:"os-"+Date.now(), customerName:customerName, note:note, amount:amount, paymentMethod:m.paymentMethod, at:new Date().toISOString() });
        closeModal();
        toast("บันทึกยอดขายขาด "+fmtMoney(amount)+" แล้ว","good");
      }
    };
  }
  if(m.type==="planDetail"){
    var pdb=document.getElementById("planDetailBuy");
    if(pdb) pdb.onclick=function(){ STATE.modal={type:"buyPlan", planId:m.planId}; render(); };
  }
  if(m.type==="addMailbox"){
    var pr=document.getElementById("mbProvider"); if(pr) pr.onchange=function(){ m.provider=pr.value; render(); };
    var srcSel=document.getElementById("mbSourceGmail"); if(srcSel) srcSel.onchange=function(){ m.sourceMailboxId=srcSel.value; updateForwardPreview(); };
    var tagInput=document.getElementById("mbForwardTag"); if(tagInput) tagInput.oninput=function(){ m.forwardTag=tagInput.value; updateForwardPreview(); };
    updateForwardPreview();
    var confirmBtn=document.getElementById("mbConfirm");
    if(confirmBtn) confirmBtn.onclick=function(){
      var emailEl=document.getElementById("mbEmail");
      var email=emailEl?emailEl.value.trim():"";
      if(!email){ toast("กรุณากรอกอีเมล","bad"); return; }
      var provider=(document.getElementById("mbProvider")||{}).value||m.provider||"GMAIL";
      var btn=confirmBtn; btn.disabled=true;
      var mailboxId = m.editId || ("mbx-new-"+Date.now());

      if(provider==="OUTLOOK_FORWARD"){
        var sourceMailboxId=(document.getElementById("mbSourceGmail")||{}).value||"";
        var forwardTag=((document.getElementById("mbForwardTag")||{}).value||"").trim().replace(/[^a-zA-Z0-9]/g,"");
        if(!sourceMailboxId){ toast("กรุณาเลือก Gmail ปลายทาง","bad"); btn.disabled=false; return; }
        if(!forwardTag){ toast("กรุณากรอกแท็กแยกบัญชี","bad"); btn.disabled=false; return; }
        fetch("/api/mailbox-creds", {
          method:"POST",
          headers:{"content-type":"application/json","authorization":"Bearer "+adminToken()},
          body:JSON.stringify({mailboxId:mailboxId, email:email, provider:provider, sourceMailboxId:sourceMailboxId, forwardTag:forwardTag})
        }).then(function(r){ return r.json().catch(function(){return {};}); }).then(function(res){
          btn.disabled=false;
          if(res && res.ok){
            if(m.editId){
              var existing=byId(MAILBOXES,m.editId);
              if(existing){ existing.email=email; existing.provider=provider; existing.sourceMailboxId=sourceMailboxId; existing.forwardTag=forwardTag; }
              closeModal(); toast("บันทึกการแก้ไขบัญชีอีเมลแล้ว","good");
            }else{
              MAILBOXES.push({id:mailboxId, email:email, provider:provider, sourceMailboxId:sourceMailboxId, forwardTag:forwardTag, status:"NOT_CONNECTED", lastResult:"ยังไม่ดึง OTP", lastAt:null});
              closeModal(); toast("เพิ่มบัญชีอีเมลแล้ว — อย่าลืมตั้งค่า Forwarding ใน Outlook ด้วย","good");
            }
          } else { toast("บันทึกไม่สำเร็จ ("+((res&&res.error)||"unknown")+")","bad"); }
        }).catch(function(){ btn.disabled=false; toast("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง","bad"); });
        return;
      }

      var appPass=(document.getElementById("mbAppPass")||{}).value||"";
      function finishSave(){
        if(m.editId){
          var existing=byId(MAILBOXES,m.editId);
          if(existing){ existing.email=email; existing.provider=provider; }
          closeModal(); toast("บันทึกการแก้ไขบัญชีอีเมลแล้ว","good");
        }else{
          MAILBOXES.push({id:mailboxId, email:email, provider:provider, status:"NOT_CONNECTED", lastResult:"ยังไม่ดึง OTP", lastAt:null});
          closeModal(); toast("เพิ่มบัญชีอีเมลแล้ว","good");
        }
      }
      if(!appPass){ finishSave(); return; }
      fetch("/api/mailbox-creds", {
        method:"POST",
        headers:{"content-type":"application/json","authorization":"Bearer "+adminToken()},
        body:JSON.stringify({mailboxId:mailboxId, email:email, provider:provider, appPassword:appPass})
      }).then(function(r){ return r.json().catch(function(){return {};}); }).then(function(res){
        btn.disabled=false;
        if(res && res.ok){ finishSave(); }
        else { toast("บันทึกรหัสผ่านแอปไม่สำเร็จ ("+((res&&res.error)||"unknown")+")","bad"); }
      }).catch(function(){ btn.disabled=false; toast("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง","bad"); });
    };
  }
  if(m.type==="addCustomer"){
    document.getElementById("custConfirm").onclick=function(){
      var name=document.getElementById("custName").value.trim(), email=document.getElementById("custEmail").value.trim();
      var contactType=(document.getElementById("custContactType")||{}).value||"Facebook";
      var contact=(document.getElementById("custContact")||{}).value||"", note=(document.getElementById("custNote")||{}).value||"";
      if(!name||!email){ toast("กรุณากรอกข้อมูลให้ครบ","bad"); return; }
      if(m.editId){
        var c=customer(m.editId);
        if(c){ c.name=name; c.email=email; c.contactType=contactType; c.contact=contact.trim(); c.note=note; }
        closeModal(); toast("บันทึกการแก้ไขลูกค้าแล้ว","good");
      }else{
        CUSTOMERS.push({id:"cus-new-"+Date.now(), name:name, email:email, contactType:contactType, contact:contact.trim(), note:note, pin:false, since:new Date().toISOString()});
        closeModal(); toast("เพิ่มลูกค้าใหม่แล้ว","good");
      }
    };
  }
  if(m.type==="editAccount"){
    document.getElementById("editAccConfirm").onclick=function(){
      var name=document.getElementById("editAccName").value.trim(), email=document.getElementById("editAccEmail").value.trim();
      var note=(document.getElementById("editAccNote")||{}).value||"";
      if(!name){ toast("กรุณากรอกชื่อบัญชี","bad"); return; }
      var acc=account(m.accountId);
      if(acc){ acc.name=name; acc.email=email; acc.note=note; }
      logActivity("ACCOUNT_UPDATED", "แก้ไขข้อมูลบัญชี "+name, name);
      closeModal(); toast("บันทึกการแก้ไขบัญชีแล้ว","good");
    };
  }
  if(m.type==="addAccount"){
    document.getElementById("addAccConfirm").onclick=function(){
      var name=document.getElementById("addAccName").value.trim();
      var email=document.getElementById("addAccEmail").value.trim();
      var pass=document.getElementById("addAccPass").value;
      var note=(document.getElementById("addAccNote")||{}).value||"";
      var countRaw=Number(document.getElementById("addAccProfiles").value);
      var count=Number.isInteger(countRaw)&&countRaw>=1&&countRaw<=20?countRaw:5;
      if(!name){ toast("กรุณากรอกชื่อบัญชี","bad"); return; }
      var newId="acc-"+Date.now();
      ACCOUNTS.push({id:newId, name:name, email:email, pass:pass||"••••••••", mailbox:null, note:note});
      for(var i=1;i<=count;i++){
        PROFILES.push({id:"pf-"+Date.now()+"-"+i, accountId:newId, name:"FH - User "+i, pin:null, device:"-", rentalId:null});
      }
      logActivity("ACCOUNT_CREATED", "เพิ่มบัญชี "+name+" พร้อมโปรไฟล์ "+count+" โปรไฟล์", name);
      closeModal(); toast("เพิ่มบัญชี "+name+" พร้อมโปรไฟล์ "+count+" โปรไฟล์แล้ว","good");
    };
  }
}

function revenueEvents(){
  var events = RENTALS.map(function(r){
    var cust=customer(r.customerId), p=profile(r.profileId);
    return { at:r.startedAt, amount:(r.price!=null?r.price:planPrice(r.days)), days:r.days,
      customerId:r.customerId||null, deviceType:r.deviceType||null,
      customerName:cust?cust.name:"-", profileName:p?p.name:"-", kind:"เช่าใหม่", paymentMethod:r.paymentMethod||"-" };
  }).concat(RENEWALS.map(function(h){
    var r=rental(h.rentalId), cust=r?customer(r.customerId):null, p=r?profile(r.profileId):null;
    return { at:h.at, amount:(h.price!=null?h.price:planPrice(h.days)), days:h.days,
      customerId:r?r.customerId:null, deviceType:r?r.deviceType:null,
      customerName:cust?cust.name:"-", profileName:p?p.name:"-", kind:"ต่ออายุ", paymentMethod:h.paymentMethod||"-" };
  })).concat(ONETIME_SALES.map(function(s){
    return { id:s.id, at:s.at, amount:s.amount, days:null, customerId:null, deviceType:null,
      customerName:s.customerName||"-", profileName:s.note||"ขายขาด", kind:"ขายขาด", paymentMethod:s.paymentMethod||"-" };
  }));
  return events.sort(function(a,b){ return new Date(b.at)-new Date(a.at); });
}

var REVENUE_RANGE = 14;
function viewAdminRevenue(){
  var events = revenueEvents();
  var now = Date.now();
  var sumSince = function(hrs){ return events.filter(function(e){ return now-new Date(e.at).getTime() <= hrs*3600000; }).reduce(function(s,e){return s+e.amount;},0); };
  var todayKey = dayKey(new Date().toISOString());
  var sumToday = events.filter(function(e){ return dayKey(e.at)===todayKey; }).reduce(function(s,e){return s+e.amount;},0);
  var sum7 = sumSince(24*7), sum30 = sumSince(24*30);
  var sumAll = events.reduce(function(s,e){return s+e.amount;},0);

  // จัดกลุ่มตามวัน (ปฏิทินกรุงเทพฯ)
  var byDay = {};
  events.forEach(function(e){ var k=dayKey(e.at); if(!byDay[k]) byDay[k]={amount:0,count:0,events:[]}; byDay[k].amount+=e.amount; byDay[k].count+=1; byDay[k].events.push(e); });
  var dayKeys = Object.keys(byDay).sort().reverse().slice(0, REVENUE_RANGE);
  var maxDay = dayKeys.reduce(function(m,k){ return Math.max(m, byDay[k].amount); }, 1);

  var cardsHtml =
    '<div class="grid grid-4">' +
      '<div class="card" style="padding:16px"><div class="muted" style="font-size:12px">วันนี้</div><div style="font-size:20px;font-weight:800;margin-top:4px">'+fmtMoney(sumToday)+'</div></div>' +

function mailboxApiFetch(path, mailboxId){
  return fetch(path, {
    method:"POST",
    headers:{"content-type":"application/json","authorization":"Bearer "+adminToken()},
    body:JSON.stringify({mailboxId:mailboxId})
  }).then(function(r){
    if(r.status===401){ clearAdminSession(); toast("เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่","bad"); go("login"); return {ok:false,error:"unauthorized"}; }
    return r.json().catch(function(){ return {ok:false,error:"bad_response"}; });
  }).catch(function(){ return {ok:false,error:"network_error"}; });
}
function mountMailboxRowEvents(){
  document.querySelectorAll('[data-test]').forEach(function(btn){
    btn.onclick=function(){
      var id=btn.getAttribute("data-test"); var m=mailbox(id); if(!m) return;
      m.status="REFRESHING"; refreshMailboxView();
      mailboxApiFetch("/api/mailbox-test", id).then(function(res){
        var cur=mailbox(id); if(!cur) return;
        if(res && res.ok){ cur.status="CONNECTED"; toast("ทดสอบการเชื่อมต่อสำเร็จ","good"); }
        else { cur.status="ERROR"; toast(res && res.error==="network_error" ? "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้" : otpErrorText(res&&res.error),"bad"); }
        refreshMailboxView();
      });
    };
  });
  document.querySelectorAll('[data-fetch]').forEach(function(btn){
    btn.onclick=function(){
      var id=btn.getAttribute("data-fetch"); var m=mailbox(id); if(!m) return;
      btn.disabled=true; btn.textContent="กำลังดึง...";
      mailboxApiFetch("/api/otp", id).then(function(res){
        var cur=mailbox(id); if(!cur) return;
        if(res && res.ok && res.code){
          cur.lastCode=res.code; cur.lastResult="พบรหัส OTP ล่าสุด"; cur.lastAt=new Date().toISOString(); cur.status="CONNECTED";
          logActivity("OTP_REQUESTED", "ดึงรหัส OTP จากกล่องเมล "+cur.email+" สำเร็จ", cur.email);
          toast("ดึงรหัส OTP สำเร็จ: "+res.code,"good");
        }else{
          cur.lastCode=null; cur.lastResult=otpErrorText(res&&res.error); cur.lastAt=new Date().toISOString();
          toast(res && res.error==="network_error" ? "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้" : cur.lastResult,"bad");
        }
        refreshMailboxView(); schedulePersist();
      });
    };
  });
  document.querySelectorAll('[data-editmb]').forEach(function(btn){
    btn.onclick=function(){ openEditMailboxModal(btn.getAttribute("data-editmb")); };
  });
  document.querySelectorAll('[data-delmb]').forEach(function(btn){
    btn.onclick=function(){
      var id=btn.getAttribute("data-delmb");
      var idx=MAILBOXES.findIndex(function(x){return x.id===id});
      if(idx>=0) MAILBOXES.splice(idx,1);
      refreshMailboxView(); toast("ลบบัญชีอีเมลแล้ว","good");
      fetch("/api/mailbox-creds?mailboxId="+encodeURIComponent(id), { method:"DELETE", headers:{"authorization":"Bearer "+adminToken()} }).catch(function(){});
    };
  });

var TYPE_META = {
  ACCOUNT_CREATED:["เพิ่มบัญชี","badge-info"],ACCOUNT_UPDATED:["แก้ไขบัญชี","badge-info"],
  CUSTOMER_ASSIGNED:["เพิ่มลูกค้าเข้าโปรไฟล์","badge-good"],RENEWED:["ต่ออายุ","badge-demo"],
  EXPIRED:["หมดเวลา","badge-bad"],RELEASED:["คืนเป็นว่าง","badge-neutral"],
  SECRET_VIEWED:["เปิดดูข้อมูลสำคัญ","badge-demo"],OTP_REQUESTED:["ขอ OTP","badge-info"]
};
function viewAdminActivity(){
  var q=(ACTIVITY_UI.search||"").trim().toLowerCase();
  var list = ACTIVITY.slice().sort(function(a,b){return new Date(b.at)-new Date(a.at)});
  if(q){
    list = list.filter(function(a){
      var meta=TYPE_META[a.type]||["กิจกรรม","badge-neutral"];
      return (a.actor||"").toLowerCase().indexOf(q)>=0 || (a.target||"").toLowerCase().indexOf(q)>=0 ||
        (a.detail||"").toLowerCase().indexOf(q)>=0 || meta[0].toLowerCase().indexOf(q)>=0;
    });
  }
  var itemsHtml = list.length ? list.map(function(a){
    var meta=TYPE_META[a.type]||["กิจกรรม","badge-neutral"];
    return '<div style="padding:14px 18px;border-bottom:1px solid var(--border);display:flex;gap:10px"><span class="badge '+meta[1]+'" style="height:fit-content">'+meta[0]+'</span>' +
      '<div style="flex:1"><div style="font-size:12.5px">'+esc(a.detail)+'</div><div class="faint" style="font-size:11px;margin-top:3px">โดย '+esc(a.actor)+' · '+esc(a.target)+' · '+fmtDT(a.at)+'</div></div></div>';
  }).join("") : ('<div style="padding:28px 18px" class="muted" style="font-size:12.5px">' +
      (q ? 'ไม่พบกิจกรรมที่ตรงกับคำค้นหา' : 'ยังไม่มีกิจกรรม — รายการจะเริ่มบันทึกอัตโนมัติเมื่อมีการเพิ่ม/แก้ไขบัญชี มอบหมายโปรไฟล์ ต่ออายุ คืนโปรไฟล์ เปิดดูข้อมูลสำคัญ หรือดึง OTP') +
    '</div>');
  var body = '<div style="display:flex;flex-direction:column;gap:14px">' +
    '<input class="input" id="actSearch" placeholder="ค้นหาผู้ดำเนินการ หรือรายการที่เกี่ยวข้อง" style="max-width:420px" value="'+esc(ACTIVITY_UI.search)+'">' +
    '<div class="card" style="padding:0">'+itemsHtml+'</div>' +
  '</div>';
  return adminShell("admin-activity","ประวัติกิจกรรม",body);
}
function mountAdminActivity(){
  var s=document.getElementById("actSearch");
  if(s) s.oninput=function(){ ACTIVITY_UI.search=s.value; render(true); };
}

    '<div class="card" style="padding:18px"><div class="section-title">ข้อมูลร้าน</div>' +
      '<div class="grid grid-2">' +
        '<div class="field"><label>ชื่อร้าน</label><input class="input" id="setShopName" value="'+esc(SHOP.name)+'"></div>' +
        '<div class="field"><label>ช่องทางติดต่อ LINE (ลิงก์)</label><input class="input" id="setShopLine" value="'+esc(SHOP.contactLine)+'"></div>' +
        '<div class="field"><label>ช่องทางติดต่อ Facebook (ลิงก์)</label><input class="input" id="setShopFb" value="'+esc(SHOP.contactFacebook)+'"></div>' +

      '<div style="display:flex;align-items:center;gap:8px"><span class="muted" style="font-size:12.5px">สลับธีม:</span>'+themeToggleHTML('tt-settings')+'</div></div>' +

        '<button class="btn btn-primary btn-sm" id="enableNotifyBtn" '+(NOTIFY.permission==="granted"?"disabled":"")+'>'+(NOTIFY.permission==="granted"?"เปิดใช้งานแล้ว":"เปิดการแจ้งเตือน")+'</button></div>' +

      '<div id="plansWrap">'+plansHtml+'</div>' +

    '<div style="display:flex;justify-content:flex-end"><button class="btn btn-primary" id="saveSettingsBtn">บันทึกการตั้งค่า</button></div>' +

function mountAdminSettings(){
  var sn=document.getElementById("setShopName"); if(sn) sn.oninput=function(){ SHOP.name=sn.value; };
  var sl=document.getElementById("setShopLine"); if(sl) sl.oninput=function(){ SHOP.contactLine=sl.value; };
  var sf=document.getElementById("setShopFb"); if(sf) sf.oninput=function(){ SHOP.contactFacebook=sf.value; };
  var st=document.getElementById("setShopTagline"); if(st) st.oninput=function(){ SHOP.tagline=st.value; };
  document.querySelectorAll('[data-plan-id]').forEach(function(inp){
    inp.oninput=function(){
      var pl=byId(PLANS,inp.getAttribute("data-plan-id")); if(!pl) return;
      var field=inp.getAttribute("data-plan-field");
      if(field==="name") pl.name=inp.value;
      else if(field==="days"){ var d=Number(inp.value); pl.days=(Number.isFinite(d)&&d>0)?d:pl.days; }
      else if(field==="price"){ var pr=Number(inp.value); pl.price=(Number.isFinite(pr)&&pr>=0)?pr:pl.price; }
    };
  });
  document.querySelectorAll('[data-addplan]').forEach(function(btn){
    btn.onclick=function(){
      var deviceId=btn.getAttribute("data-addplan");
      var newId="plan-new-"+(PLAN_ID_SEQ++);
      PLANS.push({id:newId, device:deviceId, name:"แพ็กเกจใหม่", days:1, price:0});
      toast("เพิ่มแพ็กเกจแล้ว แก้ชื่อ/วัน/ราคาได้เลย","good");
      render();
    };
  });
  document.querySelectorAll('[data-delplan]').forEach(function(btn){
    btn.onclick=function(){
      var id=btn.getAttribute("data-delplan");
      var idx=PLANS.findIndex(function(p){ return p.id===id; });
      if(idx>=0) PLANS.splice(idx,1);
      toast("ลบแพ็กเกจแล้ว","good");
      render();
    };
  });
  var b=document.getElementById("saveSettingsBtn"); if(b) b.onclick=function(){ toast("บันทึกการตั้งค่าแล้ว การเปลี่ยนแปลงมีผลทั่วทั้งเว็บไซต์ทันที","good"); render(); };
  var nb=document.getElementById("enableNotifyBtn"); if(nb) nb.onclick=requestNotifyPermission;
}

/* ================================================================ render */
function render(skipScroll){
  var route = currentRoute();
  if(route.indexOf("admin")===0 && !hasValidLocalToken()){
    clearAdminSession();
    location.hash = "login";
    route = "login";
  }
  var html;

  if(route==="home") html=viewHome();
  else if(route==="login") html=viewLogin();
  else if(route==="admin") html=viewAdminDashboard();
  else if(route==="admin-accounts") html=viewAdminAccounts();
  else if(route.indexOf("admin-account-")===0) html=viewAdminAccountDetail(route.slice(14));
  else if(route==="admin-customers") html=viewAdminCustomers();
  else if(route.indexOf("admin-customer-")===0) html=viewAdminCustomerDetail(route.slice(15));
  else if(route==="admin-reviews") html=viewAdminReviews();
  else if(route==="admin-rentals") html=viewAdminRentals();
  else if(route==="admin-revenue") html=viewAdminRevenue();
  else if(route==="admin-mailboxes") html=viewAdminMailboxes();
  else if(route==="admin-activity") html=viewAdminActivity();
  else if(route==="admin-settings") html=viewAdminSettings();
  else html=viewHome();

  html += modalHTML();
  document.getElementById("app").innerHTML = html;
  if(!skipScroll) window.scrollTo(0,0);

  mountAdminShellEvents();
  mountThemeToggleButtons();
  mountModal();

  if(route!=="login" && route.indexOf("admin")!==0) mountHome();
  if(route==="login") mountLogin();
  else if(route==="admin-accounts") mountAdminAccounts();
  else if(route.indexOf("admin-account-")===0) mountAdminAccountDetail(route.slice(14));
  else if(route==="admin-customers") mountAdminCustomers();
  else if(route.indexOf("admin-customer-")===0) mountAdminCustomerDetail(route.slice(15));
  else if(route==="admin-reviews") mountAdminReviews();
  else if(route==="admin-rentals") mountAdminRentals();
  else if(route==="admin-revenue") mountAdminRevenue();
  else if(route==="admin-mailboxes") mountAdminMailboxes();
  else if(route==="admin-activity") mountAdminActivity();
  else if(route==="admin-settings") mountAdminSettings();

  schedulePersist();
}

// อย่าแจ้งเตือนย้อนหลังสำหรับรายการที่หมดเวลา/ใกล้หมดเวลาอยู่แล้วตั้งแต่โหลดหน้าแรก
function seedNotifySeen(){
  currentExpiredRentalIds().forEach(function(id){ NOTIFY.seen["exp:"+id]=true; });
  currentExpiringSoonRentalIds().forEach(function(id){ NOTIFY.seen["soon:"+id]=true; });
}
seedNotifySeen();
setInterval(checkExpiryNotifications, 10000);
render();
hydrateFromBackend();
})();
